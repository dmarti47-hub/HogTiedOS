# BlueZ settings for HogTiedOS.
[General]
# What phones see when pairing
Name = HogTiedOS
# Major class Audio/Video, minor Car audio; services Audio + Rendering
Class = 0x240420
# Not visible until the rider presses Pair (hbas-btd sets a timeout)
DiscoverableTimeout = 180
PairableTimeout = 180
# Paired phones reconnect on their own
FastConnectable = true

[Policy]
AutoEnable = true
